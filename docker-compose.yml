# Streaming stack for the stream container (node 2). Settings: copy .env.example to .env.
#   docker compose up -d --build
# Node 1 runs only the stitcher: see docker-compose.node1.yml.

x-control: &control
  build: ./control
  image: media-control:local
  restart: unless-stopped
  env_file: .env
  environment:
    DB_PATH: /data/control.db
    RECORDINGS_DIR: /recordings
    STATUS_DIR: /data/status

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    restart: unless-stopped
    # The whole mediamtx/ folder, not single files: a git pull replaces files, and a container keeps
    # seeing the old file through a single-file mount. MediaMTX reloads its config when it changes.
    command: ["/conf/mediamtx.yml"]
    environment:
      TZ: UTC  # recording file names are read as UTC
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_IP:-}
      MTX_PATHDEFAULTS_SRTPUBLISHPASSPHRASE: ${SRT_PASSPHRASE:-}
      MTX_PATHDEFAULTS_SRTREADPASSPHRASE: ${SRT_PASSPHRASE:-}
    volumes:
      - ./mediamtx:/conf:ro
      - ${HOST_RECORDINGS_DIR:-./recordings}:/recordings
    ports:
      - "8890:8890/udp"  # SRT (players' OBS, casters' OBS)
      - "8189:8189/udp"  # WebRTC media
      # WebRTC pages (browser publish/view), behind the reverse proxy
      - "${MEDIA_HTTP_BIND:-127.0.0.1}:8889:8889"
    depends_on:
      - control

  control:
    <<: *control
    command: ["python", "-m", "mediactl.server"]
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - ${HOST_RECORDINGS_DIR:-./recordings}:/recordings
    ports:
      # Bot API: only the bot may reach this (firewall + bearer token)
      - "${CONTROL_BIND:-127.0.0.1}:9000:9000"
      # Players' go-live page, behind the reverse proxy at /go/ (next to MediaMTX's port 8889)
      - "${MEDIA_HTTP_BIND:-127.0.0.1}:9002:9002"

  delay:
    <<: *control
    command: ["python", "-m", "mediactl.delay"]
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - ${HOST_RECORDINGS_DIR:-./recordings}:/recordings:ro
    depends_on:
      - mediamtx
      - control

  archiver:
    <<: *control
    command: ["python", "-m", "mediactl.archiver"]
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - ${HOST_RECORDINGS_DIR:-./recordings}:/recordings
      - ./secrets:/secrets:ro
    depends_on:
      - control
